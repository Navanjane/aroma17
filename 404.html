<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found | Aroma 17</title>
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf { min-height: calc(100vh - 69px); display: flex; align-items: center; justify-content: center; padding: 32px var(--gutter) 64px; background: var(--bg-alt); overflow: hidden; }
    .nf-scene { display: flex; align-items: center; justify-content: center; gap: clamp(8px, 3vw, 40px); width: 100%; max-width: 900px; }
    .nf-copy { flex: 1 1 auto; text-align: right; min-width: 0; }
    .nf-code { margin: 0 0 8px; font-size: .85rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--label-2); opacity: 0; }
    .nf-title { margin: 0; font-size: clamp(1.9rem, 7vw, 4rem); font-weight: 600; letter-spacing: -.03em; line-height: 1.08; color: var(--label); opacity: 0; clip-path: inset(0 0 0 100%); }
    .nf-sub { margin: 16px 0 0; color: var(--label-2); font-size: 1.05rem; opacity: 0; }
    .nf-actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-top: 24px; opacity: 0; }
    .nf-bottle { flex: none; width: clamp(150px, 34vw, 300px); cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    .nf-bottle svg { display: block; width: 100%; height: auto; overflow: visible; }
    .nf-hint { margin: 10px 0 0; text-align: center; font-size: .8rem; color: var(--label-2); }

    /* Timeline (plays once; click the bottle to spray again) */
    .play .liquid { transform-box: fill-box; animation: nf-fill 1.1s cubic-bezier(.3,.7,.3,1) both; }
    .play .pump { animation: nf-pump .5s ease-in-out 1.15s both; }
    .play .mist circle { transform-box: fill-box; transform-origin: center; opacity: 0; animation: nf-mist 1.5s ease-out 1.2s both; animation-delay: calc(1.2s + var(--d) * .05s); }
    .play .nf-title { animation: nf-reveal 1.3s cubic-bezier(.2,.7,.2,1) 1.35s both; }
    .play .nf-code { animation: nf-fade .8s ease 1.9s both; }
    .play .nf-sub { animation: nf-fade .8s ease 2.2s both; }
    .play .nf-actions { animation: nf-fade .8s ease 2.4s both; }
    @keyframes nf-fill { from { transform: translateY(80%); } to { transform: translateY(0); } }
    @keyframes nf-pump { 0%, 100% { transform: translateY(0); } 45% { transform: translateY(6px); } }
    @keyframes nf-mist { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 15% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(2.6); } }
    @keyframes nf-reveal { 0% { opacity: 0; clip-path: inset(0 0 0 100%); filter: blur(10px); } 25% { opacity: 1; } 100% { opacity: 1; clip-path: inset(0 0 0 0); filter: blur(0); } }
    @keyframes nf-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .mist circle:nth-child(1) { --dx: -110px; --dy: -6px; --d: 0; }
    .mist circle:nth-child(2) { --dx: -170px; --dy: -28px; --d: 1; }
    .mist circle:nth-child(3) { --dx: -150px; --dy: 22px; --d: 2; }
    .mist circle:nth-child(4) { --dx: -230px; --dy: -10px; --d: 3; }
    .mist circle:nth-child(5) { --dx: -200px; --dy: 36px; --d: 4; }
    .mist circle:nth-child(6) { --dx: -260px; --dy: -34px; --d: 5; }
    .mist circle:nth-child(7) { --dx: -130px; --dy: 10px; --d: 6; }
    .mist circle:nth-child(8) { --dx: -300px; --dy: 8px; --d: 7; }
    .mist circle:nth-child(9) { --dx: -190px; --dy: -18px; --d: 8; }
    .mist circle:nth-child(10) { --dx: -280px; --dy: 28px; --d: 9; }

    @media (max-width: 560px) { .nf-scene { flex-direction: column-reverse; } .nf-copy { text-align: center; } .nf-actions { justify-content: center; } .mist circle { --dy: 0px; } .nf-bottle { width: 200px; } }
    @media (prefers-reduced-motion: reduce) {
      .play .liquid, .play .pump, .play .mist circle { animation: none; }
      .play .mist circle { opacity: 0; }
      .play .nf-title, .play .nf-code, .play .nf-sub, .play .nf-actions { animation: none; opacity: 1; clip-path: none; }
    }
  </style>
</head>
<body>
  <header class="top-bar"><div class="wrap top-inner"><a class="wordmark" href="/index.html">AROMA 17</a><a class="btn btn-amber btn-sm" href="/products.html">Shop</a></div></header>
  <main class="nf">
    <div class="nf-scene play" id="scene">
      <div class="nf-copy">
        <p class="nf-code">Error 404</p>
        <h1 class="nf-title">There's nothing here</h1>
        <p class="nf-sub">The page you're looking for has drifted away.</p>
        <div class="nf-actions"><a class="btn btn-amber" href="/index.html">Back to home</a><a class="btn btn-outline" href="/products.html">Browse fragrances</a></div>
      </div>
      <div>
        <button class="nf-bottle" id="bottle" type="button" aria-label="Spray again">
          <svg viewBox="-20 0 140 130" aria-hidden="true" focusable="false">
            <defs><clipPath id="nf-clip"><rect x="34" y="58" width="44" height="64" rx="9"/></clipPath></defs>
            <g clip-path="url(#nf-clip)"><rect class="liquid" x="28" y="58" width="56" height="70" fill="#0071e3" opacity=".85"/></g>
            <rect x="34" y="58" width="44" height="64" rx="9" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
            <rect x="49" y="46" width="14" height="12" fill="none" stroke="#1d1d1f" stroke-width="2.5"/>
            <rect x="42" y="36" width="28" height="10" rx="3" fill="#1d1d1f"/>
            <g class="pump"><rect x="52" y="22" width="8" height="14" fill="#1d1d1f"/><path d="M44 22h24a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H52l-8 2z" fill="#1d1d1f"/><circle cx="43" cy="18" r="1.6" fill="#fff"/></g>
            <g class="mist" fill="#0071e3">
              <circle cx="38" cy="18" r="3.4"/><circle cx="38" cy="18" r="2.8"/><circle cx="38" cy="18" r="3.2"/><circle cx="38" cy="18" r="2.4"/><circle cx="38" cy="18" r="3"/>
              <circle cx="38" cy="18" r="2.6"/><circle cx="38" cy="18" r="3.4"/><circle cx="38" cy="18" r="2.2"/><circle cx="38" cy="18" r="3"/><circle cx="38" cy="18" r="2.6"/>
            </g>
          </svg>
        </button>
        <p class="nf-hint">Tap the bottle to spray again</p>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var scene = document.getElementById("scene");
      document.getElementById("bottle").addEventListener("click", function () {
        scene.classList.remove("play"); void scene.offsetWidth; scene.classList.add("play");
      });
    })();
  </script>
</body>
</html>
