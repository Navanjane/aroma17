<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Aroma 17</title>
  <meta name="description" content="Questions about a fragrance, a gift or an order? We reply fastest on WhatsApp.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-head">
      <div class="wrap">
        <h1>Contact us</h1>
        <p>Questions about a fragrance, a gift or an order? We reply fastest on WhatsApp.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap contact-grid">
        <div class="info">
          <div class="info-block"><h2>WhatsApp</h2><p><a data-wa-number href="#" target="_blank" rel="noopener">[WHATSAPP NUMBER]</a></p></div>
          <div class="info-block"><h2>Email</h2><p data-business="email"></p></div>
          <div class="info-block"><h2>Visit</h2><p data-business="address"></p></div>
          <div class="info-block"><h2>Hours</h2><p data-business="hours"></p></div>
          <div class="map" role="img" aria-label="Map placeholder">[MAP]</div>
        </div>

        <div class="form-card">
          <h2>Send us a message</h2>
          <div class="field"><label for="c-name">Your name</label><input id="c-name" type="text" autocomplete="name"></div>
          <div class="field"><label for="c-want">What are you looking for?</label><input id="c-want" type="text"></div>
          <div class="field"><label for="c-msg">Message</label><textarea id="c-msg" rows="5"></textarea></div>
          <a class="btn btn-wa btn-block" id="c-send" href="#" target="_blank" rel="noopener"><svg class="wa-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38a9.9 9.9 0 0 0 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.84 9.84 0 0 0 12.04 2zm0 18.15h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.83c0 4.54-3.7 8.22-8.23 8.22zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-2-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.5.11-.11.25-.29.37-.43.12-.14.17-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.42h-.48c-.17 0-.43.06-.66.31-.22.25-.86.85-.86 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.67-1.18.21-.58.21-1.07.14-1.18-.06-.1-.23-.16-.48-.29z"/></svg>Send via WhatsApp</a>
          <p class="helper">Your message opens in WhatsApp, so we can reply to you directly.</p>
        </div>
      </div>
    </section>
  </main>
  <div id="site-footer"></div>

</html>
